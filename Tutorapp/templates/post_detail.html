{% extends "base.html" %}

{% block content%}
<div class="post-entry">
    <h2>{{ post.Class }}</h2>
    <p>{{ post.TA }}</p>
    <p>{{ post.Date }} ({{ post.get_Day_display }}) from {{ post.TimeStart|time:"g:i A" }} to {{ post.TimeEnd|time:"g:i A" }}</p>
</div>
<div>
<p><a href="{%url 'post_edit' post.pk %}">Edit Session</a></p>
<p><a href="{%url 'post_delete' post.pk %}">Delete Session</a></p>
</div>
{% endblock content%}
