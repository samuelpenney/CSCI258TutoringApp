{% extends "base.html" %}
{% block content %}
<h2>Sign Up</h2>
<form method="post">{% csrf_token %} 
    {{ form.as_p }} 
    <button type="submit">Sign Up</button>
</form> 
<script>
    const subjectBoxes = document.querySelectorAll('input[name="subjects"]');
    const courseBoxes = document.querySelectorAll('input[name="courses"]');
    function filterCourses() {
        const selected = [...subjectBoxes].filter(b => b.checked).map(b => b.value);
        courseBoxes.forEach(box => {
            const show = selected.some(s => box.value.startsWith(s) && /^\d/.test(box.value.slice(s.length)));
            const label = box.closest('label') || box;
            label.style.display = show ? '' : 'none';
            if (!show) box.checked = false;
        });
    }
    subjectBoxes.forEach(b => b.addEventListener('change', filterCourses));
    filterCourses();
</script>
{% endblock content %}
