{% extends "base.html" %}
{% block content %}
<h1>Delete Session</h1>
<form action="" method="post">{% csrf_token %}
    <p>Are you sure you want to delete "{{ post.Class }}" on {{ post.Date }} ({{ post.get_Day_display }}) at {{ post.TimeStart|time:"g:i A" }}?</p>
    <input type="submit" value="Confirm">
</form>
{% endblock content %}
